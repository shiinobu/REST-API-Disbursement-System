version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: DISBURSEMENT_SYSTEM
    ports:
      - "8080:8080"
    env_file:
      - .env
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    container_name: DISBURSEMENT_SYSTEM_DB
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: disbursement_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mysql_data: